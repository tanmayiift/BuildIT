AWSTemplateFormatVersion: "2010-09-09"
Description: BuildIT Ireland-only ephemeral artifact encryption and storage boundary

Parameters:
  Environment:
    Type: String
    AllowedValues: [production, staging]
  VercelProjectName:
    Type: String
    Default: buildit-content-broker
    AllowedPattern: '^[a-zA-Z0-9._-]+$'
  VercelTeamSlug:
    Type: String
    Default: buildit-agentic-review
    AllowedPattern: '^[a-zA-Z0-9._-]+$'
  ArtifactRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 7

Rules:
  IrelandOnly:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", eu-west-1]
        AssertDescription: BuildIT source-derived artifacts and BYOK wrapping keys must remain in eu-west-1.

Resources:
  # Retained, never deleted: the content broker's role trusts this provider, so deleting it - by a
  # removal from this template or a replacement on a URL change - would stop every review from
  # reaching its artifacts. It was imported into the stack on 3 October 2026, replacing the record of
  # the previous Vercel team's provider; docs/operations/known-defects.md has the history.
  VercelOidcProvider:
    Type: AWS::IAM::OIDCProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: !Sub https://oidc.vercel.com/${VercelTeamSlug}
      ClientIdList:
        - !Sub https://vercel.com/${VercelTeamSlug}
      # The live provider's thumbprint. Omitting it would make an update strip the list.
      ThumbprintList:
        - ab9d0263244dd0326eb67015705a667e79cfe998
      Tags:
        - Key: product
          Value: buildit

  ContentBrokerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: buildit-production-content-broker
      Description: Short-lived production access for the BuildIT content broker only
      MaxSessionDuration: 3600
      # A JSON string through Fn::Sub rather than a YAML map, because the condition KEYS carry the team
      # slug and CloudFormation requires map keys to be strings. The previous form used `!Sub` as a
      # key, which CloudFormation parses as an intrinsic-function map and rejects with "map keys must
      # be strings" - so this template could not be deployed at all, and nothing ran
      # validate-template to notice. tests/architecture/aws-boundary.test.ts now refuses an intrinsic
      # used as a key.
      AssumeRolePolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": { "Federated": "${VercelOidcProvider}" },
            "Action": "sts:AssumeRoleWithWebIdentity",
            "Condition": {
              "StringEquals": {
                "oidc.vercel.com/${VercelTeamSlug}:aud": "https://vercel.com/${VercelTeamSlug}",
                "oidc.vercel.com/${VercelTeamSlug}:sub": "owner:${VercelTeamSlug}:project:${VercelProjectName}:environment:production"
              }
            }
          }]
        }
      Tags:
        - Key: product
          Value: buildit
        - Key: workload
          Value: content-broker

  BuildITKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: BuildIT production envelope and ephemeral artifact key (Ireland)
      EnableKeyRotation: true
      Enabled: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      MultiRegion: false
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: BrokerEnvelopeOperations
            Effect: Allow
            Principal:
              AWS: !GetAtt ContentBrokerRole.Arn
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
            Resource: "*"
            Condition:
              StringEquals:
                "aws:RequestedRegion": eu-west-1
              "Null":
                "kms:EncryptionContext:organizationId": "false"
                "kms:EncryptionContext:credentialId": "false"
                "kms:EncryptionContext:purpose": "false"
          - Sid: BrokerS3ArtifactEncryption
            Effect: Allow
            Principal:
              AWS: !GetAtt ContentBrokerRole.Arn
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: "*"
            Condition:
              StringEquals:
                "aws:RequestedRegion": eu-west-1
                "kms:ViaService": s3.eu-west-1.amazonaws.com
              StringLike:
                "kms:EncryptionContext:aws:s3:arn":
                  - !Sub arn:${AWS::Partition}:s3:::buildit-${Environment}-${AWS::AccountId}-artifacts-eu-west-1
                  - !Sub arn:${AWS::Partition}:s3:::buildit-${Environment}-${AWS::AccountId}-artifacts-eu-west-1/*
          - Sid: S3InventoryEncryption
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: kms:GenerateDataKey
            Resource: "*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
              ArnLike:
                "aws:SourceArn": !Sub arn:${AWS::Partition}:s3:::buildit-${Environment}-${AWS::AccountId}-artifacts-eu-west-1
  BuildITKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/buildit-${Environment}-eu-west-1
      TargetKeyId: !Ref BuildITKey

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DependsOn: ArtifactInventoryBucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub buildit-${Environment}-${AWS::AccountId}-artifacts-eu-west-1
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt BuildITKey.Arn
              SSEAlgorithm: aws:kms
      LifecycleConfiguration:
        Rules:
          - Id: ExpungeEphemeralArtifacts
            Prefix: artifacts/
            Status: Enabled
            ExpirationInDays: !Ref ArtifactRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: ExpungeReplayMarkers
            Prefix: grant-replay/
            Status: Enabled
            ExpirationInDays: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended
      InventoryConfigurations:
        - Id: DailyDeletionAudit
          Enabled: true
          IncludedObjectVersions: Current
          ScheduleFrequency: Daily
          Destination:
            BucketArn: !GetAtt ArtifactInventoryBucket.Arn
            Format: CSV
            Prefix: inventory
      Tags:
        - Key: product
          Value: buildit
        - Key: data-class
          Value: ephemeral-source-derived
        - Key: region-boundary
          Value: eu-west-1

  ArtifactInventoryBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub buildit-${Environment}-${AWS::AccountId}-artifact-inventory-eu-west-1
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt BuildITKey.Arn
              SSEAlgorithm: aws:kms
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDeletionInventory
            Status: Enabled
            ExpirationInDays: 14
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended

  ArtifactInventoryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactInventoryBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactInventoryBucket.Arn
              - !Sub ${ArtifactInventoryBucket.Arn}/*
            Condition:
              Bool:
                "aws:SecureTransport": "false"
          - Sid: AllowS3InventoryDelivery
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${ArtifactInventoryBucket.Arn}/inventory/*
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
                "s3:x-amz-acl": bucket-owner-full-control
              ArnLike:
                "aws:SourceArn": !Sub arn:${AWS::Partition}:s3:::buildit-${Environment}-${AWS::AccountId}-artifacts-eu-west-1

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub ${ArtifactBucket.Arn}/*
            Condition:
              Bool:
                "aws:SecureTransport": "false"
          - Sid: DenyUnencryptedObjectWrites
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource:
              - !Sub ${ArtifactBucket.Arn}/artifacts/*
              - !Sub ${ArtifactBucket.Arn}/grant-replay/*
            Condition:
              StringNotEquals:
                "s3:x-amz-server-side-encryption": aws:kms
          - Sid: DenyWrongEncryptionKey
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource:
              - !Sub ${ArtifactBucket.Arn}/artifacts/*
              - !Sub ${ArtifactBucket.Arn}/grant-replay/*
            Condition:
              StringNotEquals:
                "s3:x-amz-server-side-encryption-aws-kms-key-id": !GetAtt BuildITKey.Arn
          - Sid: BrokerArtifactObjectsOnly
            Effect: Allow
            Principal:
              AWS: !GetAtt ContentBrokerRole.Arn
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub ${ArtifactBucket.Arn}/artifacts/*
          - Sid: BrokerListsArtifactPrefixOnly
            Effect: Allow
            Principal:
              AWS: !GetAtt ContentBrokerRole.Arn
            Action: s3:ListBucket
            Resource: !GetAtt ArtifactBucket.Arn
            Condition:
              StringLike:
                "s3:prefix": artifacts/*
          - Sid: BrokerCreatesReplayMarkersOnly
            Effect: Allow
            Principal:
              AWS: !GetAtt ContentBrokerRole.Arn
            Action: s3:PutObject
            Resource: !Sub ${ArtifactBucket.Arn}/grant-replay/*

Outputs:
  ContentBrokerRoleArn:
    Value: !GetAtt ContentBrokerRole.Arn
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  KmsKeyArn:
    Value: !GetAtt BuildITKey.Arn
  KmsAlias:
    Value: !Ref BuildITKeyAlias
  InventoryBucketName:
    Value: !Ref ArtifactInventoryBucket
