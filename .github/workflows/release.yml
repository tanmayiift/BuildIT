name: Release

# Deployment was entirely manual and local, so a release could be skipped, half-applied, or
# left aliased to an older build with nothing to notice. This runs the same guarded scripts as
# `pnpm deploy:*:production`: deploy, assign the production alias, read the alias back, and
# probe it. The scripts fail the job if the alias did not move.
#
# A release runs after "Build and test" has passed on a push to main, for exactly the commit it
# tested - never on the push itself. Releasing on push meant every release repeated CI's full
# verify in parallel with it, and a release-configuration mistake surfaced as a red run on main of
# a public repository instead of in the pull request that made it (deploy-contract in ci.yml now
# exercises the plan on every pull request). A dispatch can still release a single surface, and
# then checks CI passed for the commit first.
on:
  workflow_run:
    workflows: ["Build and test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which production surface to release
        required: true
        default: web
        type: choice
        options: [web, broker, both, all]

permissions:
  contents: read

env:
  # A CI-triggered release has no inputs; it releases everything.
  TARGET: ${{ inputs.target || 'all' }}
  # The commit CI tested. Without this, workflow_run checks out the tip of main, which can be a
  # newer commit CI has not finished with.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  NEXT_PUBLIC_CONVEX_URL: https://judicious-barracuda-968.convex.cloud
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
  VERCEL_PROJECT_ID: prj_rU8IPaf1laMTTmQEhGun9mRxXmGA
  VERCEL_ORG_ID: team_0C3dsIfWxzBINeWinBvtOLMC

jobs:
  # CI already ran verify, security, reliability and the browser suite on this commit. What is left
  # is what only production can answer: the monitoring and the AWS boundary as deployed.
  preflight:
    # Only a successful CI run of a push to main, from this repository - never a pull request's run
    # and never a fork's. Nothing is downloaded from the CI run.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    timeout-minutes: 15
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
      # Two quick merges finish CI out of order. Deploying the older one after the newer would roll
      # production back, so a commit main has moved past is skipped: the newer commit's release
      # deploys it.
      - name: Refuse a commit main has already moved past
        id: current
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$RELEASE_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"
          else echo "Skipping $RELEASE_SHA: main is at $tip, whose release deploys it."; echo "current=false" >> "$GITHUB_OUTPUT"; fi
      - name: A dispatched release ships only a commit CI passed
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow ci.yml --commit "$RELEASE_SHA" --json conclusion --jq '.[] | select(.conclusion == "success")' | grep -q . \
            || { echo "Build and test has not passed for $RELEASE_SHA"; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - name: Verify deployed monitoring before releasing
        env:
          BUILDIT_GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.BUILDIT_GRAFANA_SERVICE_ACCOUNT_TOKEN }}
        run: pnpm alerts:verify
      # GitHub's OIDC token for this run, exchanged for the read-only buildit-ci-boundary-reader role
      # (infra/aws/ci-reader.yaml). No AWS key is stored anywhere: the role trusts only workflows of
      # this repository on main, for an hour, and can make only the reads verify-aws-boundary.mjs makes.
      - name: Assume the read-only AWS boundary role
        if: ${{ vars.BUILDIT_AWS_CI_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.BUILDIT_AWS_CI_ROLE_ARN }}
          role-session-name: buildit-ci-boundary
          aws-region: eu-west-1
      # A release is not allowed to skip this: with no role configured the script fails, and the
      # release stops rather than shipping over an unverified boundary.
      - name: Verify the AWS artifact boundary before releasing
        env:
          BUILDIT_AWS_REGION: ${{ vars.BUILDIT_AWS_REGION }}
          BUILDIT_AWS_STACK: ${{ vars.BUILDIT_AWS_STACK }}
        run: pnpm smoke:aws-boundary

  release:
    needs: preflight
    if: ${{ needs.preflight.outputs.current == 'true' }}
    # One deploy at a time, serialised on the deploy itself rather than the whole workflow. As a
    # workflow-level group, GitHub kept one run waiting and cancelled every older waiting run, so a
    # burst of merges left a trail of "cancelled" releases; preflight already skips any commit main
    # has moved past, so at most two deploys are ever in this group.
    concurrency:
      group: buildit-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - name: Refuse to start without a deploy credential
        run: test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN repository secret is not set"; exit 1; }
      - run: npm install --global vercel@59.10.0
      - name: Confirm the deploy contract before touching production
        run: pnpm deploy:web:check && pnpm deploy:broker:check
      - name: Release the web app, alias it, and probe it
        if: ${{ env.TARGET == 'web' || env.TARGET == 'both' }}
        run: pnpm deploy:web:production
      - name: Release the broker, alias it, and probe it
        if: ${{ env.TARGET == 'broker' || env.TARGET == 'both' }}
        run: pnpm deploy:broker:production

      - name: Refuse a full release without a Convex credential
        if: ${{ env.TARGET == 'all' }}
        run: test -n "$CONVEX_DEPLOY_KEY" || { echo "CONVEX_DEPLOY_KEY repository secret is not set, so CI cannot deploy the Convex backend. Run 'pnpm deploy:production' locally, or add the secret."; exit 1; }
      - name: Release all three and prove the broker serves this commit
        if: ${{ env.TARGET == 'all' }}
        run: pnpm deploy:production

      - name: Say which surfaces this release actually moved
        run: |
          echo "target=$TARGET"
          echo "Convex is deployed only by the 'all' target. 'web', 'broker' and 'both' leave the backend untouched."

  # The alias is what the GitHub App homepage, post-install redirect, and webhook URL resolve
  # through, so prove the released alias serves the app rather than trusting the deploy step.
  confirm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Signed-out production journey against the released alias
        env:
          BUILDIT_E2E_BASE_URL: https://buildit-agentic-review.vercel.app
        run: pnpm test:e2e
      # Read each deployed service's health metadata and query its shared public backend.
      - name: Web and broker agree on one Convex deployment
        env:
          # The production deployment this workflow builds the web app against; a secret may
          # override it. The check then reads what each running service actually uses.
          BUILDIT_EXPECTED_CONVEX_URL: ${{ secrets.BUILDIT_EXPECTED_CONVEX_URL || 'https://judicious-barracuda-968.convex.cloud' }}
        run: |
          if [ -z "$BUILDIT_EXPECTED_CONVEX_URL" ]; then
            echo "buildit_wiring_not_configured: BUILDIT_EXPECTED_CONVEX_URL is unset, so web/broker Convex agreement was NOT checked."
            echo "  Configure BUILDIT_EXPECTED_CONVEX_URL. The web and broker values are read from the running BuildIT services."
            exit 1
          fi
          pnpm release:wiring
