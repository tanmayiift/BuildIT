name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_CONVEX_URL: https://judicious-barracuda-968.convex.cloud

concurrency:
  group: buildit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      # The dependency gate scans a local copy of the OSV database rather than calling npm's
      # advisory endpoint, which stopped answering and was failing roughly one run in five after
      # nine minutes of retries. The database is 222MB, so it is cached per day; a miss just
      # downloads it again, and a database too old to trust fails the gate rather than passing.
      - name: Cache the OSV vulnerability database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/buildit-osv
          key: buildit-osv-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            buildit-osv-${{ runner.os }}-${{ runner.arch }}-
      - name: Security release gate
        run: pnpm security:release
      - name: Reliability release gate
        run: pnpm reliability:release
      # Validates every alert rule has a severity, an action and a runbook section that exists.
      - name: Alert rules
        run: pnpm alerts:check
      # The dashboard had no apply path at all - not an unused script, nothing. So the 14 panel
      # titles the architecture test pins described a page no automated process had ever created,
      # and the public dashboard was whatever someone last built by hand in the UI.
      - name: Dashboard definition
        run: pnpm dashboard:check
      # infra/aws/artifacts.yaml is 308 lines of CloudFormation applied by hand - the KMS key, the
      # OIDC trust scoping, and the 7-day artifact retention backstop. verify-aws-boundary.mjs was
      # written to detect drift from it and had zero references, so nothing has ever compared the
      # committed template against the live stack.
      - name: AWS artifact boundary matches the template
        env:
          BUILDIT_AWS_REGION: ${{ secrets.BUILDIT_AWS_REGION }}
          BUILDIT_AWS_STACK: ${{ secrets.BUILDIT_AWS_STACK }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$BUILDIT_AWS_STACK" ]; then
            echo "buildit_aws_boundary_not_configured: no AWS credentials, so the artifact boundary was NOT checked."
            echo "  The 7-day retention backstop and Ireland-only assertion in infra/aws/artifacts.yaml are unverified against the live stack."
            exit 0
          fi
          pnpm smoke:aws-boundary
      - name: Evaluation gate
        run: pnpm eval
      - name: CLI journey smoke
        run: pnpm smoke:cli
      # Checks the stack is actually running the rules the file describes. alerts:check passed on
      # every push for weeks while the deployed rules were the ones hand-built in the UI months
      # earlier - three of which sent 54 emails in one night, with their corrected versions sitting
      # in this repository, validated and green. A gate that reads only the file cannot tell you
      # the file is being ignored.
      #
      # Drift fails the build. A missing token warns loudly and passes: that is a setup task no
      # commit can fix, and failing every push for it turns the build red for a reason nobody can
      # act on - which teaches people to ignore a red build, the same habit the noisy alert rules
      # taught. Once the secret exists this is a real gate.
      - name: Alert rules match the deployed stack
        env:
          BUILDIT_GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.BUILDIT_GRAFANA_SERVICE_ACCOUNT_TOKEN }}
        run: pnpm alerts:verify
