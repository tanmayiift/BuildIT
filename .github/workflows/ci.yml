name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_CONVEX_URL: https://judicious-barracuda-968.convex.cloud

concurrency:
  group: buildit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release-gates:
    runs-on: ubuntu-latest
    # id-token lets the AWS boundary step exchange this run's OIDC token for the read-only role.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      # The dependency gate scans a local copy of the OSV database rather than calling npm's
      # advisory endpoint, which stopped answering and was failing roughly one run in five after
      # nine minutes of retries. The database is 222MB, so it is restored between runs; a miss
      # downloads it again, and a database too old to trust fails the gate rather than passing.
      - name: Cache the OSV vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/buildit-osv
          key: buildit-osv-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            buildit-osv-${{ runner.os }}-${{ runner.arch }}-
      - name: Security release gate
        run: pnpm security:release
      - name: Reliability release gate
        run: pnpm reliability:release
      # Validates every alert rule has a severity, an action and a runbook section that exists.
      - name: Alert rules
        run: pnpm alerts:check
      # The dashboard had no apply path at all - not an unused script, nothing. So the 14 panel
      # titles the architecture test pins described a page no automated process had ever created,
      # and the public dashboard was whatever someone last built by hand in the UI.
      - name: Dashboard definition
        run: pnpm dashboard:check
      # GitHub's OIDC token for this run, exchanged for the read-only buildit-ci-boundary-reader role
      # (infra/aws/ci-reader.yaml). No AWS key is stored anywhere: the role trusts only workflows of
      # this repository on main, for an hour, and can make only the reads verify-aws-boundary.mjs makes.
      - name: Assume the read-only AWS boundary role
        if: ${{ github.event_name != 'pull_request' && vars.BUILDIT_AWS_CI_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.BUILDIT_AWS_CI_ROLE_ARN }}
          role-session-name: buildit-ci-boundary
          aws-region: eu-west-1
      # Compares the live artifact stack against infra/aws/artifacts.yaml: KMS key, OIDC trust scoping,
      # the 7-day retention backstop and the stack policy. It warned on every run until October 2026
      # because CI had no AWS access; with the role configured, drift is a hard failure.
      - name: AWS artifact boundary matches the template
        if: ${{ github.event_name != 'pull_request' }}
        env:
          BUILDIT_AWS_REGION: ${{ vars.BUILDIT_AWS_REGION }}
          BUILDIT_AWS_STACK: ${{ vars.BUILDIT_AWS_STACK }}
          BUILDIT_AWS_CI_ROLE_ARN: ${{ vars.BUILDIT_AWS_CI_ROLE_ARN }}
        run: |
          if [ -z "$BUILDIT_AWS_CI_ROLE_ARN" ] || [ -z "$BUILDIT_AWS_STACK" ]; then
            echo "::warning title=AWS boundary unverified::No AWS boundary role is configured, so infra/aws/artifacts.yaml was NOT checked against the live stack. The 7-day retention backstop, the Ireland-only assertion and the KMS key remain unverified. Deploy infra/aws/ci-reader.yaml and set the BUILDIT_AWS_CI_ROLE_ARN, BUILDIT_AWS_REGION and BUILDIT_AWS_STACK repository variables to turn this into a real gate."
            exit 0
          fi
          pnpm smoke:aws-boundary
      # Two real accounts, each asking for the other's data, and one real session walking the
      # customer journey. Both configs refuse to run without operator-generated storage states - GitHub
      # blocks automated OAuth - and that refusal is correct. These steps are what let them run at all.
      # No states configured is a warning naming what was not proven, never a pass; states present make
      # any leak or broken journey a hard failure.
      - name: Signed-in and two-user browser evidence
        if: ${{ github.event_name != 'pull_request' }}
        env:
          BUILDIT_E2E_BASE_URL: https://buildit-agentic-review.vercel.app
          USER_A_STATE_B64: ${{ secrets.BUILDIT_E2E_USER_A_STATE_B64 }}
          USER_B_STATE_B64: ${{ secrets.BUILDIT_E2E_USER_B_STATE_B64 }}
          SESSION_STATE_B64: ${{ secrets.BUILDIT_E2E_SESSION_STATE_B64 }}
          BUILDIT_E2E_USER_A_LOGIN: ${{ vars.BUILDIT_E2E_USER_A_LOGIN }}
          BUILDIT_E2E_USER_B_LOGIN: ${{ vars.BUILDIT_E2E_USER_B_LOGIN }}
          BUILDIT_E2E_USER_A_ORG: ${{ vars.BUILDIT_E2E_USER_A_ORG }}
          BUILDIT_E2E_USER_B_ORG: ${{ vars.BUILDIT_E2E_USER_B_ORG }}
          BUILDIT_E2E_USER_A_MARKER: ${{ vars.BUILDIT_E2E_USER_A_MARKER }}
          BUILDIT_E2E_USER_B_MARKER: ${{ vars.BUILDIT_E2E_USER_B_MARKER }}
          BUILDIT_E2E_USER_A_REVIEW: ${{ vars.BUILDIT_E2E_USER_A_REVIEW }}
          BUILDIT_E2E_USER_B_REVIEW: ${{ vars.BUILDIT_E2E_USER_B_REVIEW }}
          BUILDIT_E2E_SESSION_LOGIN: ${{ vars.BUILDIT_E2E_SESSION_LOGIN }}
        run: |
          mkdir -p .local
          if [ -n "$USER_A_STATE_B64" ] || [ -n "$USER_B_STATE_B64" ] || [ -n "$SESSION_STATE_B64" ]; then
            npx playwright install --with-deps chromium
          fi
          if [ -z "$USER_A_STATE_B64" ] || [ -z "$USER_B_STATE_B64" ]; then
            echo "::warning title=Tenant isolation unproven::No two-user storage states are configured, so cross-tenant isolation was NOT checked in a real browser. Set BUILDIT_E2E_USER_A_STATE_B64 and BUILDIT_E2E_USER_B_STATE_B64 (and the BUILDIT_E2E_USER_* variables) to make this a real gate."
          else
            printf '%s' "$USER_A_STATE_B64" | base64 -d > .local/user-a.json
            printf '%s' "$USER_B_STATE_B64" | base64 -d > .local/user-b.json
            BUILDIT_E2E_USER_A_STATE=.local/user-a.json BUILDIT_E2E_USER_B_STATE=.local/user-b.json pnpm test:e2e:tenant-isolation
          fi
          if [ -z "$SESSION_STATE_B64" ]; then
            echo "::warning title=Signed-in journey unproven::No session storage state is configured, so the real signed-in journey was NOT exercised. Set BUILDIT_E2E_SESSION_STATE_B64 and BUILDIT_E2E_SESSION_LOGIN to make this a real gate."
          else
            printf '%s' "$SESSION_STATE_B64" | base64 -d > .local/session.json
            BUILDIT_E2E_SESSION_STATE=.local/session.json pnpm test:e2e:session
          fi
      - name: Evaluation gate
        run: pnpm eval
      - name: CLI journey smoke
        run: pnpm smoke:cli
      # Checks the stack is actually running the rules the file describes. alerts:check passed on
      # every push for weeks while the deployed rules were the ones hand-built in the UI months
      # earlier - three of which sent 54 emails in one night, with their corrected versions sitting
      # in this repository, validated and green. A gate that reads only the file cannot tell you
      # the file is being ignored.
      #
      # Missing read credentials block release evidence; offline checks remain separate.
      - name: Alert rules match the deployed stack
        if: ${{ github.event_name != 'pull_request' }}
        env:
          BUILDIT_GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.BUILDIT_GRAFANA_SERVICE_ACCOUNT_TOKEN }}
        run: pnpm alerts:verify
      - name: Record production-only gates deferred on pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "buildit_external_gates_deferred: AWS stack and deployed Grafana verification require protected production credentials."
          echo "  Local security, reliability, rule-definition, dashboard, evaluation, CLI and browser checks still ran above."
