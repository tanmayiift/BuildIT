name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_CONVEX_URL: https://judicious-barracuda-968.convex.cloud

concurrency:
  group: buildit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      # The dependency gate scans a local copy of the OSV database rather than calling npm's
      # advisory endpoint, which stopped answering and was failing roughly one run in five after
      # nine minutes of retries. The database is 222MB, so it is cached per day; a miss just
      # downloads it again, and a database too old to trust fails the gate rather than passing.
      - name: Cache the OSV vulnerability database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/buildit-osv
          key: buildit-osv-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            buildit-osv-${{ runner.os }}-${{ runner.arch }}-
      - name: Security release gate
        run: pnpm security:release
      - name: Reliability release gate
        run: pnpm reliability:release
      # Validates every alert rule has a severity, an action and a runbook section that exists.
      # The rules file drifted from the deployed stack for weeks because nothing checked it.
      - name: Alert rules
        run: pnpm alerts:check
      - name: Evaluation gate
        run: pnpm eval
      - name: CLI journey smoke
        run: pnpm smoke:cli
