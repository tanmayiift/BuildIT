name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_PUBLIC_CONVEX_URL: https://tacit-coyote-455.eu-west-1.convex.cloud

concurrency:
  group: buildit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
