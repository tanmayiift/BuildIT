# A mutable tag is resolved at run time, so pinning to a commit SHA is what actually decides which
# code runs. gitleaks-action ran on a floating v2 in a job that has GITHUB_TOKEN in env and, via
# fetch-depth: 0, the repository's complete history - precisely the material that job exists to
# scan. Pinning alone would freeze the actions at today's code, so Dependabot proposes the SHA
# bumps as reviewable pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    groups:
      routine-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-actions:
        applies-to: security-updates
        patterns:
          - "*"
  # pnpm uses the npm ecosystem and the shared root lockfile. A zero version-update
  # limit avoids a routine upgrade backlog; it does not restrict security updates.
  # Repository vulnerability alerts and Dependabot security updates must also be enabled.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 0
    groups:
      security-packages:
        applies-to: security-updates
        patterns:
          - "*"
